name: build

# Quoted so YAML 1.1 does not narrow "on" to the boolean True.
"on":
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build FileTabs.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/FileTabs.Tests/FileTabs.Tests.csproj -c Release --no-restore